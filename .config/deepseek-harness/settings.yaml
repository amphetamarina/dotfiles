# Keep OPENCODE_API_KEY in the machine-local environment.
agent-default-model:
  provider: opencode-go
  model: deepseek-v4-flash
  reasoningEffort: max

llm-pi-ai:
  providers:
    opencode-go:
      displayName: OpenCode Go
      apiKeyEnv: OPENCODE_API_KEY
      api: openai-completions
      baseURL: https://opencode.ai/zen/go/v1
      models:
        # Every model advertised by GET https://opencode.ai/zen/go/v1/models.
        # Entries named in the installed pi-ai catalog inherit its capacities
        # and reasoning support; the rest use the route defaults. mimo-v2-pro,
        # mimo-v2-omni, and hy3-preview are advertised but currently rejected
        # by the upstream gateway (400).
        - id: minimax-m3
          name: MiniMax-M3
        - id: minimax-m2.7
          name: MiniMax-M2.7
        - id: minimax-m2.5
          name: MiniMax M2.5
        - id: kimi-k3
          name: Kimi K3 (2x usage)
        - id: kimi-k2.7-code
          name: Kimi K2.7 Code
        - id: kimi-k2.6
          name: Kimi K2.6
        - id: kimi-k2.5
          name: Kimi K2.5
        - id: glm-5.2
          name: GLM-5.2
        - id: glm-5.1
          name: GLM-5.1
        - id: glm-5
          name: GLM-5
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
        - id: qwen3.7-max
          name: Qwen3.7 Max
        - id: qwen3.8-max
          name: Qwen3.8 Max
        - id: qwen3.7-plus
          name: Qwen3.7 Plus
        - id: qwen3.6-plus
          name: Qwen3.6 Plus
        - id: qwen3.5-plus
          name: Qwen3.5 Plus
        - id: mimo-v2-pro
          name: MiMo V2 Pro
        - id: mimo-v2-omni
          name: MiMo V2 Omni
        - id: mimo-v2.5-pro
          name: MiMo V2.5 Pro
        - id: mimo-v2.5
          name: MiMo V2.5
        - id: hy3
          name: Hy3
        - id: hy3-preview
          name: Hy3 Preview
        - id: gpt-5.6-luna
          name: GPT-5.6 Luna
    opencode-go-responses:
      # grok-4.5 is served only through the Responses API on this gateway;
      # chat/completions answers 503. Capacities and reasoning levels mirror
      # the installed pi-ai catalog entry.
      displayName: OpenCode Go (Responses)
      apiKeyEnv: OPENCODE_API_KEY
      api: openai-responses
      baseURL: https://opencode.ai/zen/go/v1
      models:
        - id: grok-4.5
          name: Grok 4.5
          contextWindow: 500000
          maxTokens: 500000
          reasoningEfforts:
            off:
            low: low
            medium: medium
            high: high
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
