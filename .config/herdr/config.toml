onboarding = false

[terminal]
default_shell = "nu"
new_cwd = "~/Workspace"

[theme]
name = "terminal"

[ui]
sidebar_width = 26
sidebar_min_width = 24
sidebar_max_width = 30
pane_borders = true
pane_gaps = true
pane_scrollbars = false
show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", { token = "workspace", bold = false }],
  [
    { token = "branch", dim = false },
    { token = "git_status", bold = false },
  ],
]

[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    "state_icon",
    { token = "workspace", bold = false },
    { token = "tab", dim = false },
  ],
  [
    { token = "agent", bold = false },
    { token = "state_text", dim = false },
  ],
]
