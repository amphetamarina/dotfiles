# Ported from .config/ghostty/config.ghostty.
# Rio reloads configuration changes automatically.

# Crisp 2x-scale layout for the 4K desktop. Keep text and TUI surfaces opaque;
# translucency and post-processing filters reduce terminal contrast.
line-height = 1.08
margin = [6, 8]
hide-mouse-cursor-when-typing = true
enable-scroll-bar = false
force-theme = "dark"

[fonts]
family = "MonoLisaCode"
size = 14
hinting = true
features = [
  "ss01",
  "liga",
  "dlig",
  "calt",
  "cv01",
  "cv02",
  "cv03",
  "cv04",
  "cv05",
  "cv08",
  "cv09",
  "cv11",
  "cv12",
]
# Rio 0.5.19 ignores a named style override for the regular slot on Linux.
# Search the exact italic file first so the regular query can only resolve to
# MonoLisa's italic face; retain the full tree for Nerd Font symbol fallback.
additional-dirs = [
  "/home/amphetamarina/.local/share/fonts/MonoLisa/Code/ttf/MonoLisaCodeItalic.ttf",
  "/home/amphetamarina/.local/share/fonts",
]
use-drawable-chars = true
symbol-map = [
  { start = "E000", end = "F8FF", font-family = "MonoLisaCode Nerd Font" },
]

# Use MonoLisa's italic face as the primary terminal face. With ss01 enabled,
# this selects the script-style letterforms for ordinary text as well.
[fonts.regular]
style = "Italic"
weight = 400

# MonoLisaCode is a variable font. Rio 0.5.19 renders its bold axis with
# incorrect terminal-cell advances, which makes bold TUI labels overlap.
# Reuse the regular face for bold cells instead of synthesizing that axis.
[fonts.bold]
style = false

[fonts.bold-italic]
style = false

[fonts.italic]
style = "Italic"
weight = 400

[renderer]
backend = "vulkan"
strategy = "events"
use-cpu = false

[window]
opacity = 1.0
opacity-cells = false
blur = false
colorspace = "srgb"

[navigation]
mode = "Tab"
hide-if-single = true
current-working-directory = true

[cursor]
shape = "beam"
blinking = false

# SynthWave '84
[colors]
background = "#262335"
foreground = "#ffffff"
cursor = "#03edf9"
vi-cursor = "#ff7edb"
selection-background = "#ffffff20"
selection-foreground = "#ffffff"

# Keep Rio's chrome and Herdr's pane separators in the same violet range.
tabs = "#848bbd"
tabs-active = "#ffffff"
bar = "#241b2f"
split = "#495495"

black = "#241b2f"
red = "#fe4450"
green = "#72f1b8"
yellow = "#f3e70f"
blue = "#03edf9"
magenta = "#ff7edb"
cyan = "#03edf9"
white = "#ffffff"

light-black = "#848bbd"
light-red = "#fe4450"
light-green = "#72f1b8"
light-yellow = "#fede5d"
light-blue = "#03edf9"
light-magenta = "#ff7edb"
light-cyan = "#03edf9"
light-white = "#ffffff"
