# Ported from .config/ghostty/config.ghostty.
# Rio reloads configuration changes automatically.

# Crisp 2x-scale layout for the 4K desktop. Keep text and TUI surfaces opaque;
# translucency and post-processing filters reduce terminal contrast.
line-height = 1.08
margin = [6, 8]
hide-mouse-cursor-when-typing = true
enable-scroll-bar = false
force-theme = "dark"

[fonts]
family = "MonoLisaCode"
size = 13
hinting = true
features = ["ss01", "dlig", "calt"]
additional-dirs = ["/home/amphetamarina/.local/share/fonts"]
use-drawable-chars = true
symbol-map = [
  { start = "E000", end = "F8FF", font-family = "MonoLisaCode Nerd Font" },
]

# MonoLisaCode is a variable font. Rio 0.5.19 renders its bold axis with
# incorrect terminal-cell advances, which makes bold TUI labels overlap.
# Reuse the regular face for bold cells instead of synthesizing that axis.
[fonts.bold]
style = false

[fonts.bold-italic]
style = false

[renderer]
backend = "vulkan"
strategy = "events"
use-cpu = false

[window]
opacity = 1.0
opacity-cells = false
blur = false
colorspace = "srgb"

[navigation]
mode = "Tab"
hide-if-single = true
current-working-directory = true

[cursor]
shape = "beam"
blinking = false

# Kanagawa Wave, aligned with Herdr's built-in Kanagawa palette.
[colors]
background = "#1f1f28"
foreground = "#dcd7ba"
cursor = "#dcd7ba"
vi-cursor = "#7e9cd8"
selection-background = "#363646"
selection-foreground = "#dcd7ba"

black = "#16161d"
red = "#c34043"
green = "#76946a"
yellow = "#c0a36e"
blue = "#7e9cd8"
magenta = "#957fb8"
cyan = "#7fb4ca"
white = "#c8c093"

light-black = "#727169"
light-red = "#e82424"
light-green = "#98bb6c"
light-yellow = "#e6c384"
light-blue = "#7fb4ca"
light-magenta = "#d27e99"
light-cyan = "#7aa89f"
light-white = "#dcd7ba"
