# Ported from .config/ghostty/config.ghostty.
# Rio reloads configuration changes automatically.

# Crisp high-density layout for the 4K desktop. Keep text and TUI surfaces opaque;
# translucency and post-processing filters reduce terminal contrast.
line-height = 1.08
margin = [6, 8]
hide-mouse-cursor-when-typing = true
enable-scroll-bar = false
force-theme = "light"

[adaptive-theme]
light = "github-light-default"
dark = "synthwave-84"

[fonts]
family = "MonoLisaCode"
size = 16
hinting = true
features = [
  "ss01",
  "liga",
  "dlig",
  "calt",
  "cv01",
  "cv02",
  "cv03",
  "cv04",
  "cv05",
  "cv08",
  "cv09",
  "cv11",
  "cv12",
]
# Rio 0.5.19 ignores a named style override for the regular slot on Linux.
# Search the exact italic file first so the regular query can only resolve to
# MonoLisa's italic face; retain the full tree for Nerd Font symbol fallback.
additional-dirs = [
  "/home/amphetamarina/.local/share/fonts/MonoLisa/Code/ttf/MonoLisaCodeItalic.ttf",
  "/home/amphetamarina/.local/share/fonts",
]
use-drawable-chars = true
symbol-map = [
  { start = "E000", end = "F8FF", font-family = "MonoLisaCode Nerd Font" },
]

# Use MonoLisa's italic face as the primary terminal face. With ss01 enabled,
# this selects the script-style letterforms for ordinary text as well.
[fonts.regular]
style = "Italic"
weight = 400

# MonoLisaCode is a variable font. Rio 0.5.19 renders its bold axis with
# incorrect terminal-cell advances, which makes bold TUI labels overlap.
# Reuse the regular face for bold cells instead of synthesizing that axis.
[fonts.bold]
style = false

[fonts.bold-italic]
style = false

[fonts.italic]
style = "Italic"
weight = 400

[renderer]
backend = "vulkan"
strategy = "events"
use-cpu = false

[window]
opacity = 1.0
opacity-cells = false
blur = false
colorspace = "srgb"

[navigation]
mode = "Tab"
hide-if-single = true
current-working-directory = true

[cursor]
shape = "beam"
blinking = false
