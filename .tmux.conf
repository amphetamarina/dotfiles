set -g extended-keys on
set -g extended-keys-format csi-u
set -g mouse on

# GitHub Light-inspired status bar
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 100
set -g status-style 'bg=#f6f8fa,fg=#57606a'

# Session and window tabs
set -g status-left '#[bg=#0969da,fg=#ffffff,bold]  ⬢ #S  #[bg=#f6f8fa,fg=#d0d7de]│ '
set -g window-status-separator ''
set -g window-status-format '#[bg=#f6f8fa,fg=#57606a]  #I:#W  '
set -g window-status-current-format '#[bg=#0969da,fg=#ffffff,bold]  ✨ #I:#W  '
set -g window-status-last-style 'bg=#ddf4ff,fg=#0969da'
set -g window-status-activity-style 'bg=#dafbe1,fg=#116329,bold'
set -g window-status-bell-style 'bg=#cf222e,fg=#ffffff,bold'

# System usage, date, and time
set -g status-right '#[bg=#f6f8fa,fg=#1a7f37]🖥 CPU #(~/Workspace/dotfiles/.config/tmux/cpu-percent.sh)#[fg=#d0d7de]  │  #[fg=#8250df]🧠 MEM #(~/Workspace/dotfiles/.config/tmux/memory-percent.sh)#[fg=#d0d7de]  │  #[fg=#57606a]📅 %a %b %d#[fg=#d0d7de]  │  #[fg=#0969da,bold]🕒 %H:%M  '

# Borders, prompts, and copy-mode selection
set -g pane-border-style 'fg=#d0d7de'
set -g pane-active-border-style 'fg=#0969da'
set -g message-style 'bg=#fff8c5,fg=#633c01,bold'
set -g message-command-style 'bg=#ddf4ff,fg=#0969da'
set -g mode-style 'bg=#0969da,fg=#ffffff'
